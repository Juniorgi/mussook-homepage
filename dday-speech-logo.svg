<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">D-Day Speech Academy Logo</title>
  <desc id="desc">Purple D-Day Speech Academy logo on a transparent background</desc>
  <defs>
    <linearGradient id="markGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#cfc5e7"/>
      <stop offset="0.5" stop-color="#6d5aa4"/>
      <stop offset="1" stop-color="#4e4385"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#514486"/>
      <stop offset="0.62" stop-color="#6b56a2"/>
      <stop offset="1" stop-color="#b47ac6"/>
    </linearGradient>
  </defs>
  <g fill="url(#markGrad)" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    <text x="26" y="160" font-size="140">D</text>
    <text x="18" y="198" font-size="118">D</text>
    <text x="106" y="198" font-size="58">AY</text>
  </g>
  <text x="285" y="126" fill="url(#textGrad)" font-family="Pretendard, SUIT, 'Noto Sans KR', Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">&#46356;-&#45936;&#51060;&#49828;&#54588;&#52824;</text>
  <text x="300" y="190" fill="#9e9cad" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="500" letter-spacing="16">SPEECH ACADEMY</text>
</svg>
